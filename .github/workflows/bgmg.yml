name: bgmg

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build bgmg
        run: go build -o bgmg ./cmd/bgmg

      - name: Upload bgmg artifact
        uses: actions/upload-artifact@v4
        with:
          name: bgmg-binary
          path: bgmg

  test-success:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download bgmg artifact
        uses: actions/download-artifact@v4
        with:
          name: bgmg-binary

      - name: Make bgmg executable
        run: chmod +x bgmg

      - name: test success
        run: echo "success"

      - name: Success
        if: success()
        run: ./bgmg 0

  test-failure:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download bgmg artifact
        uses: actions/download-artifact@v4
        with:
          name: bgmg-binary

      - name: Make bgmg executable
        run: chmod +x bgmg

      - name: test failure
        run: exit 1

      - name: failure
        if: failure()
        run: ./bgmg 1

  sample-success-with-go-install:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Install bgmg
        run: go install github.com/joeblackdddy/bgmg/cmd/bgmg@latest

      - name: Run your tests
        run: echo "All tests passed!"

      - name: Success
        if: success()
        run: bgmg 0

  sample-failure-with-go-install:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Install bgmg
        run: go install github.com/joeblackdddy/bgmg/cmd/bgmg@latest

      - name: Run your tests (this will fail)
        run: exit 1

      - name: Failure
        if: failure()
        run: bgmg 1